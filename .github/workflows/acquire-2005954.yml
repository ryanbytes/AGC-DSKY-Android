name: Acquire DSKY signal-flow aperture frames

on:
  push:
    branches:
      - research/2005954-aperture
  workflow_dispatch:

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Fetch AGC handbook drawing PDF
        run: |
          set -euxo pipefail
          mkdir -p out
          curl --fail --location --retry 3 --output out/agc_handbook_jp2.pdf \
            https://archive.org/download/agc_handbook_jp2/agc_handbook_jp2.pdf
          sha256sum out/agc_handbook_jp2.pdf | tee out/SHA256SUM.txt
          pdfinfo out/agc_handbook_jp2.pdf | tee out/PDFINFO.txt
      - name: Extract 2005918 page neighborhood
        run: |
          set -euxo pipefail
          pdftotext -f 368 -l 381 -layout out/agc_handbook_jp2.pdf out/pages-368-381.txt || true
          grep -n -C 10 -E '2005918|SIGNAL FLOW|DSKY|CHANNEL|RELAY' out/pages-368-381.txt > out/target-grep.txt || true
          mkdir -p out/render
          pdftoppm -f 369 -l 380 -r 180 -jpeg -jpegopt quality=90 \
            out/agc_handbook_jp2.pdf out/render/page
          ls -lh out/render | tee out/render-list.txt
      - name: Upload 2005918 evidence
        uses: actions/upload-artifact@v4
        with:
          name: DSKY-2005918-signal-flow-pages
          path: |
            out/SHA256SUM.txt
            out/PDFINFO.txt
            out/pages-368-381.txt
            out/target-grep.txt
            out/render/*.jpg
            out/render-list.txt
          if-no-files-found: error
          retention-days: 7
