name: Acquire DSKY 2005954 aperture frames

on:
  push:
    branches:
      - research/2005954-aperture
  workflow_dispatch:

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Fetch Batch 3 aperture-card PDF
        run: |
          set -euxo pipefail
          mkdir -p out
          curl --fail --location --retry 3 --output out/AgcApertureCardsBatch3.pdf \
            https://archive.org/download/AgcApertureCardsBatch3Images/AgcApertureCardsBatch3.pdf
          sha256sum out/AgcApertureCardsBatch3.pdf | tee out/SHA256SUM.txt
          pdfinfo out/AgcApertureCardsBatch3.pdf | tee out/PDFINFO.txt
      - name: Extract target page neighborhood
        run: |
          set -euxo pipefail
          pdftotext -f 165 -l 190 -layout out/AgcApertureCardsBatch3.pdf out/pages-165-190.txt || true
          grep -n -C 8 -E '2005954|2005957|INTERCONNECT|SIGNAL PIN' out/pages-165-190.txt > out/target-grep.txt || true
          mkdir -p out/render
          pdftoppm -f 170 -l 185 -r 180 -jpeg -jpegopt quality=90 \
            out/AgcApertureCardsBatch3.pdf out/render/page
          ls -lh out/render | tee out/render-list.txt
      - name: Upload aperture evidence
        uses: actions/upload-artifact@v4
        with:
          name: DSKY-2005954-aperture-pages
          path: |
            out/SHA256SUM.txt
            out/PDFINFO.txt
            out/pages-165-190.txt
            out/target-grep.txt
            out/render/*.jpg
            out/render-list.txt
          if-no-files-found: error
          retention-days: 7
