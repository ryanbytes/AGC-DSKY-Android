name: PWA build

on:
  workflow_dispatch:
  push:
    branches: [main, apple-port]
    paths:
      - 'pwa/**'
      - 'app/src/main/assets/**'
      - 'vendor/webAGC'
      - 'apple/tools/verify-pinned-assets.sh'
      - '.github/workflows/pwa.yml'
  pull_request:
    paths:
      - 'pwa/**'
      - 'app/src/main/assets/**'
      - 'vendor/webAGC'
      - 'apple/tools/verify-pinned-assets.sh'
      - '.github/workflows/pwa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Cloudflare Web Analytics
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing repository secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing repository secret CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          token="$(bash pwa/tools/ensure-cloudflare-web-analytics.sh ryanbytes.github.io)"
          test -n "$token" || { echo 'Cloudflare Web Analytics token was empty'; exit 1; }
          printf 'CLOUDFLARE_WEB_ANALYTICS_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Build PWA site
        run: pwa/tools/build-site.sh "$RUNNER_TEMP/agc-dsky-pwa"

      - name: PWA smoke test
        run: node pwa/tools/pwa-smoke.js "$RUNNER_TEMP/agc-dsky-pwa"

      - name: PWA sensor parity behavior test
        run: node pwa/tools/pwa-sensor-parity-smoke.js

      - name: PWA auto dim behavior test
        run: node pwa/tools/pwa-auto-dim-smoke.js

      - name: Clock mode behavior test
        run: node tools/clock-mode-behavior-smoke.js

      - name: Android frontend parity test
        run: node pwa/tools/pwa-parity-smoke.js "$RUNNER_TEMP/agc-dsky-pwa"

      - name: Shared AGC smoke tests
        run: |
          node tools/frontend-smoke.js
          node tools/agc-core-smoke.js
          node tools/wasm-runtime-smoke.js

      - name: Upload PWA bundle
        uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-PWA
          path: ${{ runner.temp }}/agc-dsky-pwa
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/agc-dsky-pwa

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
