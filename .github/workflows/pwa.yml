name: PWA build

on:
  workflow_dispatch:
  push:
    branches: [main, apple-port]
    paths:
      - 'pwa/**'
      - 'app/src/main/assets/**'
      - 'tools/compat-boundary-smoke.js'
      - 'tools/public-facade-boundary-smoke.js'
      - 'tools/clock-mode-behavior-smoke.js'
      - 'tools/relay-show-smoke.js'
      - 'tools/optics-lifecycle-smoke.js'
      - 'tools/sextant-tap-mark-smoke.js'
      - 'tools/flight-hardware-ui-smoke.js'
      - 'tools/relay-stretch-stability-smoke.js'
      - 'tools/dsky-render-stability-smoke.js'
      - 'tools/frontend-smoke.js'
      - 'tools/agc-core-smoke.js'
      - 'tools/wasm-runtime-smoke.js'
      - 'tools/capture-visual-goldens.sh'
      - 'tools/visual-golden-harness.html'
      - 'vendor/webAGC'
      - 'apple/tools/verify-pinned-assets.sh'
      - '.github/workflows/pwa.yml'
  pull_request:
    paths:
      - 'pwa/**'
      - 'app/src/main/assets/**'
      - 'tools/compat-boundary-smoke.js'
      - 'tools/public-facade-boundary-smoke.js'
      - 'tools/clock-mode-behavior-smoke.js'
      - 'tools/relay-show-smoke.js'
      - 'tools/optics-lifecycle-smoke.js'
      - 'tools/sextant-tap-mark-smoke.js'
      - 'tools/flight-hardware-ui-smoke.js'
      - 'tools/relay-stretch-stability-smoke.js'
      - 'tools/dsky-render-stability-smoke.js'
      - 'tools/frontend-smoke.js'
      - 'tools/agc-core-smoke.js'
      - 'tools/wasm-runtime-smoke.js'
      - 'tools/capture-visual-goldens.sh'
      - 'tools/visual-golden-harness.html'
      - 'vendor/webAGC'
      - 'apple/tools/verify-pinned-assets.sh'
      - '.github/workflows/pwa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build PWA site
        run: pwa/tools/build-site.sh "$RUNNER_TEMP/agc-dsky-pwa"

      - name: PWA smoke test
        run: node pwa/tools/pwa-smoke.js "$RUNNER_TEMP/agc-dsky-pwa"

      - name: Capture visual golden candidates
        run: bash tools/capture-visual-goldens.sh "$RUNNER_TEMP/agc-dsky-pwa" "$RUNNER_TEMP/visual-goldens"

      - name: Upload visual golden candidates
        uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-visual-golden-candidates
          path: |
            ${{ runner.temp }}/visual-goldens/*.png
            ${{ runner.temp }}/visual-goldens/runtime-probe.html
          if-no-files-found: error

      - name: PWA sensor parity behavior test
        run: node pwa/tools/pwa-sensor-parity-smoke.js

      - name: PWA checklist print behavior test
        run: node pwa/tools/pwa-print-bridge-smoke.js

      - name: PWA auto dim behavior test
        run: node pwa/tools/pwa-auto-dim-smoke.js

      - name: Clock mode behavior test
        run: node tools/clock-mode-behavior-smoke.js

      - name: Relay show behavior test
        run: node tools/relay-show-smoke.js

      - name: Sextant optics lifecycle test
        run: node tools/optics-lifecycle-smoke.js

      - name: Sextant tap mark cancellation test
        run: node tools/sextant-tap-mark-smoke.js

      - name: Flight hardware UI test
        run: node tools/flight-hardware-ui-smoke.js

      - name: Stretched relay stability test
        run: node tools/relay-stretch-stability-smoke.js

      - name: DSKY glyph stability test
        run: node tools/dsky-render-stability-smoke.js

      - name: EL no-flicker contract test
        run: node tools/el-no-flicker-contract-smoke.js

      - name: Android frontend parity test
        run: node pwa/tools/pwa-parity-smoke.js "$RUNNER_TEMP/agc-dsky-pwa"

      - name: Shared AGC smoke tests
        run: |
          node tools/compat-boundary-smoke.js
          node tools/public-facade-boundary-smoke.js
          node tools/frontend-smoke.js
          node tools/agc-core-smoke.js
          node tools/wasm-runtime-smoke.js

      - name: Upload PWA bundle
        uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-PWA
          path: ${{ runner.temp }}/agc-dsky-pwa
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/agc-dsky-pwa

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
