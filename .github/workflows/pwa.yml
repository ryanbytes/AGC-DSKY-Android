name: PWA build

on:
  workflow_dispatch:
  push:
    branches: [main, apple-port]
    paths:
      - 'pwa/**'
      - 'analytics/cloudflare/**'
      - 'app/src/main/assets/**'
      - 'vendor/webAGC'
      - 'apple/tools/verify-pinned-assets.sh'
      - '.github/workflows/pwa.yml'
  pull_request:
    paths:
      - 'pwa/**'
      - 'analytics/cloudflare/**'
      - 'app/src/main/assets/**'
      - 'vendor/webAGC'
      - 'apple/tools/verify-pinned-assets.sh'
      - '.github/workflows/pwa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AGC_ANALYTICS_ENDPOINT: ${{ vars.AGC_ANALYTICS_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build PWA site
        run: pwa/tools/build-site.sh "$RUNNER_TEMP/agc-dsky-pwa"

      - name: PWA smoke test
        run: node pwa/tools/pwa-smoke.js "$RUNNER_TEMP/agc-dsky-pwa"

      - name: PWA sensor parity behavior test
        run: node pwa/tools/pwa-sensor-parity-smoke.js

      - name: PWA auto dim behavior test
        run: node pwa/tools/pwa-auto-dim-smoke.js

      - name: Clock mode behavior test
        run: node tools/clock-mode-behavior-smoke.js

      - name: Relay show behavior test
        run: node tools/relay-show-smoke.js

      - name: Flight hardware UI test
        run: node tools/flight-hardware-ui-smoke.js

      - name: Android frontend parity test
        run: node pwa/tools/pwa-parity-smoke.js "$RUNNER_TEMP/agc-dsky-pwa"

      - name: Analytics backend static checks
        run: |
          node --check analytics/cloudflare/worker.js
          bash -n analytics/cloudflare/deploy.sh
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          sql = Path('analytics/cloudflare/migrations/0001_init.sql').read_text(encoding='utf-8')
          db = sqlite3.connect(':memory:')
          db.executescript(sql)
          for table in ('clients', 'daily_usage'):
              row = db.execute("SELECT name FROM sqlite_master WHERE type='table' AND name=?", (table,)).fetchone()
              if not row:
                  raise SystemExit(f'missing migration table: {table}')
          print('Analytics schema: PASS')
          PY

      - name: Shared AGC smoke tests
        run: |
          node tools/frontend-smoke.js
          node tools/agc-core-smoke.js
          node tools/wasm-runtime-smoke.js

      - name: Upload PWA bundle
        uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-PWA
          path: ${{ runner.temp }}/agc-dsky-pwa
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/agc-dsky-pwa

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4