name: Relay archive bridge

on:
  pull_request:
    branches: [ main ]

jobs:
  fetch-indicator-driver-acceptance-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch 2016009 aperture-card scans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          base="https://archive.org/download/apertureCardBox466Part1NARASW_images/page"
          for n in $(seq 183 209); do
            echo "Fetching n${n}"
            curl --fail --location --retry 3 --retry-delay 2               "${base}/n${n}.jpg"               --output "out/n${n}.jpg"
            test -s "out/n${n}.jpg"
            file "out/n${n}.jpg"
          done
          sha256sum out/*.jpg > out/SHA256SUMS.txt
      - name: Upload scans
        uses: actions/upload-artifact@v4
        with:
          name: indicator-driver-2016009-scans
          path: out
          if-no-files-found: error
          retention-days: 1
