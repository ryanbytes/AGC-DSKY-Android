name: RLY-02 emulator QA

on:
  push:
    branches:
      - 'audit/rly-02-physical-relays'
  workflow_dispatch:

concurrency:
  group: rly02-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build regular debug APK from RLY-02 head
        run: |
          set -euxo pipefail
          bash tools/gradle-bootstrap.sh --no-daemon --stacktrace :app:verifyPinnedAgcAssets :app:assembleRegularDebug
          test -f app/build/outputs/apk/regular/debug/app-regular-debug.apk
          sha256sum app/build/outputs/apk/regular/debug/app-regular-debug.apk

      - name: Install CDP client
        run: python3 -m pip install --quiet websocket-client

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Run packaged WebView RLY-02 runtime gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash tools/rly02-emulator-qa.sh
