name: Android build

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'build-tools;36.0.0' 'platform-tools'

      - name: Canonical source smoke tests
        run: bash tools/run-source-smokes.sh

      - name: Build release, EL test, and unique install-fix APKs
        run: bash tools/gradle-bootstrap.sh --no-daemon --stacktrace :app:clean :app:verifyPinnedAgcAssets :app:assembleRelease :app:assembleRegularDebug :app:assembleFireDebug :app:assembleRegularInstallfix

      - name: Verify APK outputs exist
        run: |
          test -f app/build/outputs/apk/regular/release/app-regular-release-unsigned.apk
          test -f app/build/outputs/apk/fire/release/app-fire-release-unsigned.apk
          test -f app/build/outputs/apk/regular/debug/app-regular-debug.apk
          test -f app/build/outputs/apk/fire/debug/app-fire-debug.apk
          test -f app/build/outputs/apk/regular/installfix/app-regular-installfix.apk

      - name: Sign installable regular and Fire APKs
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          KS="$RUNNER_TEMP/agc-dsky-ci.keystore"
          keytool -genkeypair -noprompt \
            -keystore "$KS" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=AGC DSKY CI,O=AGC DSKY,C=US"
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/regular/release/AGC-DSKY-regular.apk \
            app/build/outputs/apk/regular/release/app-regular-release-unsigned.apk
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/fire/release/AGC-DSKY-fire.apk \
            app/build/outputs/apk/fire/release/app-fire-release-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs app/build/outputs/apk/regular/release/AGC-DSKY-regular.apk
          "$BT/apksigner" verify --verbose --print-certs app/build/outputs/apk/fire/release/AGC-DSKY-fire.apk
          "$BT/aapt" dump badging app/build/outputs/apk/regular/release/AGC-DSKY-regular.apk | tee /tmp/regular-badging.txt
          "$BT/aapt" dump badging app/build/outputs/apk/fire/release/AGC-DSKY-fire.apk | tee /tmp/fire-badging.txt
          grep -F "package: name='org.apollo.agcdsky'" /tmp/regular-badging.txt
          grep -F "package: name='org.apollo.agcdsky'" /tmp/fire-badging.txt

      - name: Verify shared frontend parity in every Android package
        run: |
          python3 tools/verify-shared-frontend-parity.py --source app/src/main/assets --apk app/build/outputs/apk/regular/release/AGC-DSKY-regular.apk --label android-regular-release
          python3 tools/verify-shared-frontend-parity.py --source app/src/main/assets --apk app/build/outputs/apk/fire/release/AGC-DSKY-fire.apk --label android-fire-release
          python3 tools/verify-shared-frontend-parity.py --source app/src/main/assets --apk app/build/outputs/apk/regular/debug/app-regular-debug.apk --label android-regular-debug
          python3 tools/verify-shared-frontend-parity.py --source app/src/main/assets --apk app/build/outputs/apk/fire/debug/app-fire-debug.apk --label android-fire-debug
          python3 tools/verify-shared-frontend-parity.py --source app/src/main/assets --apk app/build/outputs/apk/regular/installfix/app-regular-installfix.apk --label android-installfix

      - name: Verify side-by-side APK signatures, packages, icons, and restored assets
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          test -n "$VERSION_NAME"
          for APK in \
            app/build/outputs/apk/regular/debug/app-regular-debug.apk \
            app/build/outputs/apk/fire/debug/app-fire-debug.apk; do
            "$BT/apksigner" verify --verbose --print-certs "$APK"
            "$BT/aapt" dump badging "$APK" | tee /tmp/eltest-badging.txt
            grep -F "package: name='org.apollo.agcdsky.eltest'" /tmp/eltest-badging.txt
            grep -F "application-label:'AGC DSKY v${VERSION_NAME}'" /tmp/eltest-badging.txt
            unzip -l "$APK" | grep -F 'res/mipmap-xxhdpi-v4/ic_launcher_original.webp'
          done
          FIX=app/build/outputs/apk/regular/installfix/app-regular-installfix.apk
          "$BT/apksigner" verify --verbose --print-certs "$FIX"
          "$BT/aapt" dump badging "$FIX" | tee /tmp/installfix-badging.txt
          grep -F "package: name='org.apollo.agcdsky.installfix'" /tmp/installfix-badging.txt
          grep -F "application-label:'AGC DSKY v${VERSION_NAME}'" /tmp/installfix-badging.txt
          unzip -l "$FIX" | grep -F 'assets/hardware-color-mode.js'
          unzip -l "$FIX" | grep -F 'assets/hardware-color-mode.css'
          unzip -p "$FIX" assets/index.html | grep -F '<script src="hardware-color-mode.js"></script>'
          unzip -p "$FIX" assets/screen-only.js | grep -F 'setTimeout(()=>{compExitTap=false;exit(false)},0)'
          unzip -p "$FIX" assets/app-shell-runtime.js | grep -F "if(document.body.classList.contains('controls-visible'))"
          unzip -p "$FIX" assets/app-shell-runtime.js | grep -F 'if(tapHideControls)hideControls()'
          unzip -p "$FIX" assets/parallax-3d.js | grep -F 'GLASS_VIEW_THICKNESS_IN'

      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-Android-installable
          path: |
            app/build/outputs/apk/regular/release/AGC-DSKY-regular.apk
            app/build/outputs/apk/fire/release/AGC-DSKY-fire.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-Android-unsigned-release
          path: |
            app/build/outputs/apk/regular/release/app-regular-release-unsigned.apk
            app/build/outputs/apk/fire/release/app-fire-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-ELTEST-debug
          path: |
            app/build/outputs/apk/regular/debug/app-regular-debug.apk
            app/build/outputs/apk/fire/debug/app-fire-debug.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-Regular-installfix
          path: app/build/outputs/apk/regular/installfix/app-regular-installfix.apk
          if-no-files-found: error
          retention-days: 30


  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'build-tools;36.0.0' 'platform-tools'

      - name: Build and sign regular release APK for emulator
        run: |
          bash tools/gradle-bootstrap.sh --no-daemon --stacktrace :app:clean :app:verifyPinnedAgcAssets :app:assembleRegularRelease
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          KS="$RUNNER_TEMP/agc-dsky-emulator.keystore"
          keytool -genkeypair -noprompt             -keystore "$KS"             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=AGC DSKY Emulator QA,O=AGC DSKY,C=US"
          "$BT/apksigner" sign             --ks "$KS"             --ks-key-alias androiddebugkey             --ks-pass pass:android             --key-pass pass:android             --out "$RUNNER_TEMP/AGC-DSKY-emulator-qa.apk"             app/build/outputs/apk/regular/release/app-regular-release-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/AGC-DSKY-emulator-qa.apk"
          "$BT/aapt" dump badging "$RUNNER_TEMP/AGC-DSKY-emulator-qa.apk" | tee "$RUNNER_TEMP/apk-badging.txt"

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run DSKY on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            OUT="$RUNNER_TEMP/dsky-emulator-qa"
            mkdir -p "$OUT"
            APK="$RUNNER_TEMP/AGC-DSKY-emulator-qa.apk"
            PKG="org.apollo.agcdsky"

            adb wait-for-device
            adb shell getprop ro.build.version.release | tee "$OUT/android-version.txt"
            adb shell getprop ro.build.version.sdk | tee -a "$OUT/android-version.txt"
            adb shell wm size | tee "$OUT/display.txt"
            adb shell wm density | tee -a "$OUT/display.txt"

            adb install -r "$APK" | tee "$OUT/install.txt"
            adb shell dumpsys package "$PKG" | grep -E 'versionName=|versionCode=' | head -10 | tee "$OUT/package-version.txt"

            ACTIVITY="$(adb shell cmd package resolve-activity --brief "$PKG" | tr -d '\r' | tail -1)"
            printf '%s\n' "$ACTIVITY" | tee "$OUT/activity.txt"

            adb logcat -c
            adb shell am force-stop "$PKG"
            adb shell am start -W -n "$ACTIVITY" | tee "$OUT/launch.txt"
            sleep 4

            adb exec-out screencap -p > "$OUT/01-launch.png"
            adb exec-out uiautomator dump /dev/tty > "$OUT/01-launch.xml" || true

            cat > "$OUT/tap_text.py" <<'PY'
            import re, sys, xml.etree.ElementTree as ET
            xml_path, wanted = sys.argv[1], sys.argv[2].upper()
            data=open(xml_path,'r',encoding='utf-8',errors='ignore').read()
            data=data[data.find('<?xml'):] if '<?xml' in data else data
            root=ET.fromstring(data)
            for n in root.iter('node'):
                vals=[(n.attrib.get('text') or '').strip(), (n.attrib.get('content-desc') or '').strip()]
                if any(v.upper()==wanted for v in vals if v):
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib.get('bounds',''))
                    if m:
                        x1,y1,x2,y2=map(int,m.groups())
                        print((x1+x2)//2, (y1+y2)//2)
                        sys.exit(0)
            sys.exit(2)
            PY

            python3 - <<'PY' > "$OUT/ui-nodes.txt"
            import xml.etree.ElementTree as ET, os
            p=os.environ['RUNNER_TEMP']+'/dsky-emulator-qa/01-launch.xml'
            data=open(p,'r',encoding='utf-8',errors='ignore').read()
            data=data[data.find('<?xml'):] if '<?xml' in data else data
            try:
                root=ET.fromstring(data)
                for n in root.iter('node'):
                    text=(n.attrib.get('text') or '').strip()
                    desc=(n.attrib.get('content-desc') or '').strip()
                    bounds=n.attrib.get('bounds','')
                    if text or desc:
                        print(f"text={text!r} desc={desc!r} bounds={bounds}")
            except Exception as e:
                print("UI_PARSE_ERROR", repr(e))
            PY

            dump_ui() {
              adb exec-out uiautomator dump /dev/tty > "$OUT/current.xml"
            }
            tap_label() {
              local label="$1"
              dump_ui || true
              if xy="$(python3 "$OUT/tap_text.py" "$OUT/current.xml" "$label" 2>/dev/null)"; then
                set -- $xy
                adb shell input tap "$1" "$2"
                sleep 0.7
                return 0
              fi
              echo "MISSING_UI_NODE:$label" | tee -a "$OUT/interaction.txt"
              return 1
            }

            INTERACTION=0
            if tap_label VERB; then
              tap_label 3 || INTERACTION=1
              tap_label 5 || INTERACTION=1
              tap_label ENTR || INTERACTION=1
            else
              INTERACTION=1
            fi

            sleep 3
            adb exec-out screencap -p > "$OUT/02-after-v35.png"
            adb exec-out uiautomator dump /dev/tty > "$OUT/02-after-v35.xml" || true
            adb shell dumpsys activity top > "$OUT/activity-top.txt"
            adb logcat -d > "$OUT/logcat.txt"
            adb logcat -b crash -d > "$OUT/crash.txt" || true

            PID="$(adb shell pidof -s "$PKG" || true)"
            echo "pid=$PID" | tee "$OUT/result.txt"
            if [ -z "$PID" ]; then
              echo "APP_PROCESS_NOT_RUNNING" | tee -a "$OUT/result.txt"
              exit 10
            fi
            if grep -Eq 'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: org\.apollo\.agcdsky.*has died' "$OUT/logcat.txt"; then
              echo "FATAL_CRASH_FOUND" | tee -a "$OUT/result.txt"
              exit 11
            fi
            if [ "$INTERACTION" -eq 0 ]; then
              echo "V35_UI_SEQUENCE_EXECUTED" | tee -a "$OUT/result.txt"
            else
              echo "APP_LAUNCHED_BUT_WEBVIEW_KEYS_NOT_EXPOSED_TO_UIAUTOMATOR" | tee -a "$OUT/result.txt"
            fi

      - name: Collect emulator QA evidence
        if: always()
        run: |
          mkdir -p emulator-qa-artifact
          cp -a "$RUNNER_TEMP/dsky-emulator-qa/." emulator-qa-artifact/ 2>/dev/null || true
          cp "$RUNNER_TEMP/apk-badging.txt" emulator-qa-artifact/ 2>/dev/null || true
          cp "$RUNNER_TEMP/AGC-DSKY-emulator-qa.apk" emulator-qa-artifact/ 2>/dev/null || true
          printf 'source_commit=fdbf2ddbea7b90e25775395f5134693d36131ddc\n' > emulator-qa-artifact/source.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DSKY-emulator-QA
          path: emulator-qa-artifact
          if-no-files-found: warn
          retention-days: 7
