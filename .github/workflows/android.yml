name: Android build

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'build-tools;36.0.0' 'platform-tools'

      - name: Canonical source smoke tests
        run: bash tools/run-source-smokes.sh

      - name: Build release, EL test, and unique install-fix APKs
        run: bash tools/gradle-bootstrap.sh --no-daemon --stacktrace :app:clean :app:verifyPinnedAgcAssets :app:assembleRelease :app:assembleRegularDebug :app:assembleFireDebug :app:assembleRegularInstallfix

      - name: Verify APK outputs exist
        run: |
          test -f app/build/outputs/apk/regular/release/app-regular-release-unsigned.apk
          test -f app/build/outputs/apk/fire/release/app-fire-release-unsigned.apk
          test -f app/build/outputs/apk/regular/debug/app-regular-debug.apk
          test -f app/build/outputs/apk/fire/debug/app-fire-debug.apk
          test -f app/build/outputs/apk/regular/installfix/app-regular-installfix.apk

      - name: Sign installable regular and Fire APKs
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          KS="$RUNNER_TEMP/agc-dsky-ci.keystore"
          keytool -genkeypair -noprompt \
            -keystore "$KS" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=AGC DSKY CI,O=AGC DSKY,C=US"
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/regular/release/AGC-DSKY-regular.apk \
            app/build/outputs/apk/regular/release/app-regular-release-unsigned.apk
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/fire/release/AGC-DSKY-fire.apk \
            app/build/outputs/apk/fire/release/app-fire-release-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs app/build/outputs/apk/regular/release/AGC-DSKY-regular.apk
          "$BT/apksigner" verify --verbose --print-certs app/build/outputs/apk/fire/release/AGC-DSKY-fire.apk
          "$BT/aapt" dump badging app/build/outputs/apk/regular/release/AGC-DSKY-regular.apk | tee /tmp/regular-badging.txt
          "$BT/aapt" dump badging app/build/outputs/apk/fire/release/AGC-DSKY-fire.apk | tee /tmp/fire-badging.txt
          grep -F "package: name='org.apollo.agcdsky'" /tmp/regular-badging.txt
          grep -F "package: name='org.apollo.agcdsky'" /tmp/fire-badging.txt

      - name: Verify side-by-side APK signatures, packages, icons, and restored assets
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          test -n "$VERSION_NAME"
          for APK in \
            app/build/outputs/apk/regular/debug/app-regular-debug.apk \
            app/build/outputs/apk/fire/debug/app-fire-debug.apk; do
            "$BT/apksigner" verify --verbose --print-certs "$APK"
            "$BT/aapt" dump badging "$APK" | tee /tmp/eltest-badging.txt
            grep -F "package: name='org.apollo.agcdsky.eltest'" /tmp/eltest-badging.txt
            grep -F "application-label:'AGC DSKY v${VERSION_NAME}'" /tmp/eltest-badging.txt
            unzip -l "$APK" | grep -F 'res/mipmap-xxhdpi-v4/ic_launcher_original.webp'
          done
          FIX=app/build/outputs/apk/regular/installfix/app-regular-installfix.apk
          "$BT/apksigner" verify --verbose --print-certs "$FIX"
          "$BT/aapt" dump badging "$FIX" | tee /tmp/installfix-badging.txt
          grep -F "package: name='org.apollo.agcdsky.installfix'" /tmp/installfix-badging.txt
          grep -F "application-label:'AGC DSKY v${VERSION_NAME}'" /tmp/installfix-badging.txt
          unzip -l "$FIX" | grep -F 'assets/hardware-color-mode.js'
          unzip -l "$FIX" | grep -F 'assets/hardware-color-mode.css'
          unzip -p "$FIX" assets/index.html | grep -F '<script src="hardware-color-mode.js"></script>'
          unzip -p "$FIX" assets/screen-only.js | grep -F 'compExitTap=true;exit(false)'
          unzip -p "$FIX" assets/app-shell-runtime.js | grep -F "if(document.body.classList.contains('controls-visible'))"
          unzip -p "$FIX" assets/app-shell-runtime.js | grep -F 'if(tapHideControls)hideControls()'
          unzip -p "$FIX" assets/parallax-3d.js | grep -F 'GLASS_VIEW_THICKNESS_IN'

      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-Android-installable
          path: |
            app/build/outputs/apk/regular/release/AGC-DSKY-regular.apk
            app/build/outputs/apk/fire/release/AGC-DSKY-fire.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-Android-unsigned-release
          path: |
            app/build/outputs/apk/regular/release/app-regular-release-unsigned.apk
            app/build/outputs/apk/fire/release/app-fire-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-ELTEST-debug
          path: |
            app/build/outputs/apk/regular/debug/app-regular-debug.apk
            app/build/outputs/apk/fire/debug/app-fire-debug.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-Regular-installfix
          path: app/build/outputs/apk/regular/installfix/app-regular-installfix.apk
          if-no-files-found: error
          retention-days: 30
