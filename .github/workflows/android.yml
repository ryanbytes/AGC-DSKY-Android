name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager 'build-tools;36.0.0' 'platform-tools'

      - name: Build and verify local debug APKs
        run: bash tools/build-local.sh

      - name: Verify Fire debug APK exists
        run: test -f app/build/outputs/apk/fire/debug/app-fire-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-Fire-debug
          path: app/build/outputs/apk/fire/debug/app-fire-debug.apk
          if-no-files-found: error
          retention-days: 30
