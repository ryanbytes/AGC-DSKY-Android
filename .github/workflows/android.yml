name: Android build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager 'build-tools;36.0.0' 'platform-tools'

      - name: Source and NTP smoke tests
        run: |
          node tools/branding-smoke.js
          node tools/manifest-policy-smoke.js
          bash tools/ntp-time-smoke.sh
          node tools/ntp-policy-smoke.js
          node tools/csp-smoke.js
          node tools/frontend-smoke.js
          node tools/clock-mode-behavior-smoke.js
          node tools/cheatsheet-smoke.js
          node tools/optics-lifecycle-smoke.js
          node tools/device-v35-policy-smoke.js
          node tools/display-layout-smoke.js
          node tools/el-widget-smoke.js
          node tools/dream-orientation-smoke.js
          node tools/dream-mode-smoke.js
          node tools/solar-model-smoke.js
          node tools/agc-core-smoke.js
          node tools/native-diagnostic-smoke.js
          node tools/dsky-mapping-smoke.js
          node tools/v35-model-smoke.js
          node tools/asset-reference-smoke.js
          node tools/wasm-runtime-smoke.js

      - name: Build regular phone debug APK
        run: bash tools/gradle-bootstrap.sh --no-daemon --stacktrace :app:clean :app:verifyPinnedAgcAssets :app:assembleRegularDebug

      - name: Verify installable phone APK, icon, package and HOME capability
        run: |
          APK=app/build/outputs/apk/regular/debug/app-regular-debug.apk
          test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$($ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2 dump badging "$APK")"
          echo "$BADGING"
          grep -F "package: name='org.apollo.agcdsky.phone'" <<<"$BADGING"
          grep -F "application-label:'AGC DSKY v1.1.2'" <<<"$BADGING"
          grep -F "application-icon-" <<<"$BADGING"
          MANIFEST="$($ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2 dump xmltree --file AndroidManifest.xml "$APK")"
          grep -F 'android.intent.category.LAUNCHER' <<<"$MANIFEST"
          grep -F 'android.intent.category.HOME' <<<"$MANIFEST"
          grep -F 'android.intent.category.DEFAULT' <<<"$MANIFEST"
          ! grep -Fq 'FireRedirectAccessibilityService' <<<"$MANIFEST"

      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-Regular-Phone-installfix
          path: app/build/outputs/apk/regular/debug/app-regular-debug.apk
          if-no-files-found: error
          retention-days: 30
