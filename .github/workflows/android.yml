name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager 'build-tools;36.0.0' 'platform-tools'

      - name: Source smoke tests
        run: |
          node tools/branding-smoke.js
          node tools/manifest-policy-smoke.js
          node tools/csp-smoke.js
          node tools/frontend-smoke.js
          node tools/clock-mode-behavior-smoke.js
          node tools/cheatsheet-smoke.js
          node tools/optics-lifecycle-smoke.js
          node tools/device-v35-policy-smoke.js
          node tools/display-layout-smoke.js
          node tools/el-widget-smoke.js
          node tools/widget-relay-model-smoke.js
          node tools/dream-orientation-smoke.js
          node tools/dream-mode-smoke.js
          node tools/solar-model-smoke.js
          node tools/agc-core-smoke.js
          node tools/native-diagnostic-smoke.js
          node tools/dsky-mapping-smoke.js
          node tools/v35-model-smoke.js
          node tools/asset-reference-smoke.js
          node tools/wasm-runtime-smoke.js

      - name: Build release APKs and install-safe EL test APK
        run: bash tools/gradle-bootstrap.sh --no-daemon --stacktrace :app:clean :app:verifyPinnedAgcAssets :app:assembleRelease :app:assembleRegularDebug

      - name: Verify APK outputs exist
        run: |
          test -f app/build/outputs/apk/regular/release/app-regular-release-unsigned.apk
          test -f app/build/outputs/apk/fire/release/app-fire-release-unsigned.apk
          test -f app/build/outputs/apk/regular/debug/app-regular-debug.apk

      - name: Sign installable regular and Fire APKs
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          KS="$RUNNER_TEMP/agc-dsky-ci.keystore"
          keytool -genkeypair -noprompt \
            -keystore "$KS" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=AGC DSKY CI,O=AGC DSKY,C=US"
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/regular/release/AGC-DSKY-regular.apk \
            app/build/outputs/apk/regular/release/app-regular-release-unsigned.apk
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/fire/release/AGC-DSKY-fire.apk \
            app/build/outputs/apk/fire/release/app-fire-release-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs app/build/outputs/apk/regular/release/AGC-DSKY-regular.apk
          "$BT/apksigner" verify --verbose --print-certs app/build/outputs/apk/fire/release/AGC-DSKY-fire.apk
          "$BT/aapt" dump badging app/build/outputs/apk/regular/release/AGC-DSKY-regular.apk | tee /tmp/regular-badging.txt
          "$BT/aapt" dump badging app/build/outputs/apk/fire/release/AGC-DSKY-fire.apk | tee /tmp/fire-badging.txt
          grep -F "package: name='org.apollo.agcdsky'" /tmp/regular-badging.txt
          grep -F "package: name='org.apollo.agcdsky'" /tmp/fire-badging.txt

      - name: Verify EL test APK signature, package, and icon
        run: |
          APK=app/build/outputs/apk/regular/debug/app-regular-debug.apk
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | tee /tmp/eltest-badging.txt
          grep -F "package: name='org.apollo.agcdsky.eltest'" /tmp/eltest-badging.txt
          grep -F "application-label:'AGC DSKY v1.1.2'" /tmp/eltest-badging.txt
          unzip -l "$APK" | grep -F 'res/mipmap-xxhdpi-v4/ic_launcher_original.webp'
          unzip -p "$APK" assets/index.html | grep -F 'el-glass-background'
          unzip -p "$APK" assets/index.html | grep -F 'el-ito-dot'
          unzip -p "$APK" assets/index.html | grep -F 'fill:#696d67'

      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-Android-installable
          path: |
            app/build/outputs/apk/regular/release/AGC-DSKY-regular.apk
            app/build/outputs/apk/fire/release/AGC-DSKY-fire.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-Android-unsigned-release
          path: |
            app/build/outputs/apk/regular/release/app-regular-release-unsigned.apk
            app/build/outputs/apk/fire/release/app-fire-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-ELTEST-regular-debug
          path: app/build/outputs/apk/regular/debug/app-regular-debug.apk
          if-no-files-found: error
          retention-days: 30
