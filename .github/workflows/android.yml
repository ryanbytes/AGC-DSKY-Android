name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager 'build-tools;36.0.0' 'platform-tools'

      - name: Source smoke tests
        run: |
          node tools/branding-smoke.js
          node tools/manifest-policy-smoke.js
          node tools/csp-smoke.js
          node tools/frontend-smoke.js
          node tools/cheatsheet-smoke.js
          node tools/optics-lifecycle-smoke.js
          node tools/device-v35-policy-smoke.js
          node tools/display-layout-smoke.js
          node tools/el-widget-smoke.js
          node tools/dream-orientation-smoke.js
          node tools/solar-model-smoke.js
          node tools/agc-core-smoke.js
          node tools/native-diagnostic-smoke.js
          node tools/dsky-mapping-smoke.js
          node tools/v35-model-smoke.js
          node tools/asset-reference-smoke.js
          node tools/wasm-runtime-smoke.js

      - name: Build unsigned release APK
        run: bash tools/gradle-bootstrap.sh --no-daemon --stacktrace :app:clean :app:verifyPinnedAgcAssets :app:assembleRelease

      - name: Verify unsigned APK exists
        run: test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-Android-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
