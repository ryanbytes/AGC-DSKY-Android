name: Recover DSKY 2005954A scan frames
on:
  push:
    branches:
      - archive/dsky-2005954a-frames-20260927

jobs:
  recover-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch Internet Archive scan frames n174-n177
        shell: bash
        run: |
          set -euxo pipefail
          ID='AgcApertureCardsBatch3Images'
          mkdir -p out
          for N in 174 175 176 177; do
            OUT="out/2005954A-n${N}.jpg"
            curl -fL --connect-timeout 10 --max-time 60 --retry 2 --retry-all-errors               -A 'Mozilla/5.0'               -o "$OUT" "https://archive.org/download/$ID/page/n${N}_w2400.jpg"
            file "$OUT"
            python3 -c 'import sys; b=open(sys.argv[1],"rb").read(16); assert b.startswith(b"\xff\xd8\xff") or b.startswith(b"\x89PNG"), (sys.argv[1], b)' "$OUT"
          done
          sha256sum out/2005954A-n*.jpg > out/SHA256SUMS.txt
          ls -lh out
      - name: Upload exact recovered frames
        uses: actions/upload-artifact@v4
        with:
          name: DSKY-2005954A-frames-n174-n177
          path: out/
          if-no-files-found: error
          compression-level: 0
