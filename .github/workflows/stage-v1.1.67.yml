name: Stage standalone-signed v1.1.67 payload
on:
  push:
    branches:
      - release-payload/v1.1.67
    paths:
      - .github/workflows/stage-v1.1.67.yml
permissions:
  contents: write
  actions: write
jobs:
  stage:
    if: github.ref == 'refs/heads/release-payload/v1.1.67'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-payload/v1.1.67
          persist-credentials: true
      - name: Check exact merged release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = '28a11803fceac9d1a60685b4cd88270dccd089ae'
          test "$(git rev-parse 'origin/main^{tree}')" = 'fcec9bef194a0dc64137828896ee2a3824b7de4f'
          test "$(git show origin/main:VERSION | tr -d '\r\n')" = '1.1.67'
          test "$(tr -d '\r\n' < VERSION)" = '1.1.67'
      - name: Obtain passing unsigned release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned"
          gh run download 38660035673 --repo ryanbytes/AGC-DSKY-Android --name AGC-DSKY-1.1.67-unsigned --dir "$RUNNER_TEMP/unsigned"
      - name: Reconstruct locally signed APK bytes, verify independent pinned digests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, base64, hashlib, json, zlib
          from pathlib import Path
          u = Path(os.environ['RUNNER_TEMP'])/'unsigned'
          out = Path('release-payload/v1.1.67')
          out.mkdir(parents=True, exist_ok=True)
          evidence = {
              'regular': ('f9d2599c7a7ac204a06d1863cd98bdce565ba0b20a183833e2a3adf8b648eaa2', 'b6016d6c3be3080892a7f5a8b14641357c173477c8f018a26fd259f23eb5495c', 1112072),
              'fire': ('6151f9c7a74c3bd2bda04724dd7a7ba5cf5ab1254340d972caec744e504a1e3a', '153d7fcd1842416691e37b4451a9e808d3303eba90a4057b08a903de56ddd926', 1116168),
          }
          for variant, (basehash, signedhash, expected_size) in evidence.items():
              unsigned = (u/variant/'release'/('app-'+variant+'-release-unsigned.apk')).read_bytes()
              assert hashlib.sha256(unsigned).hexdigest() == basehash, variant + ' unsigned base digest mismatch'
              packed = Path('tools/release-v1.1.67/'+variant+'-delta.b64').read_text().strip()
              patch = json.loads(zlib.decompress(base64.b64decode(packed, validate=True)))
              assert patch['format'] == 'copy-insert-v1'
              assert patch['base_sha256'] == basehash
              assert patch['output_sha256'] == signedhash
              assert patch['output_size'] == expected_size
              result = bytearray()
              for c in patch['commands']:
                  if c[0] == 'c':
                      start, size = c[1:]
                      assert type(start) == int and type(size) == int
                      assert 0 <= start < len(unsigned) and 0 < size <= len(unsigned)-start
                      result.extend(unsigned[start:start+size])
                  elif c[0] == 'i':
                      result.extend(base64.b64decode(c[1], validate=True))
                  else:
                      raise ValueError('invalid delta opcode')
                  assert len(result) <= expected_size
              assert len(result) == expected_size
              assert hashlib.sha256(result).hexdigest() == signedhash, variant+' signed digest mismatch'
              filename = 'app-'+variant+'-release.apk'
              (out/filename).write_bytes(result)
              (out/(filename+'.sha256')).write_text(signedhash+'  '+filename+'\n')
              print(variant, 'verified', signedhash)
          (out/'RELEASE_NOTES.txt').write_text(
              'AGC DSKY v1.1.67\n\n'
              '- Adds two separate Android home widgets: DSKY Classic Clock and DSKY Date Clock.\n'
              '- Existing widgets retain their provider and become Classic DSKY Clock.\n'
              '- Classic shows PROG / VERB / NOUN with HH/MM/SS registers.\n'
              '- Date shows YEAR / MONTH / DAY with YY/MM/DD and HH/MM/SS registers.\n'
              '- Both widgets run independently of the app mode and Dream mode.\n'
              '- Original standalone-signed Regular and Fire APK payloads; physical device widgets not yet tested.\n'
          )
          PY
          (cd release-payload/v1.1.67 && sha256sum -c app-regular-release.apk.sha256 && sha256sum -c app-fire-release.apk.sha256)
      - name: Push only pinned verified signed payload
        shell: bash
        run: |
          set -euo pipefail
          git add release-payload/v1.1.67
          git -c user.name='AGC DSKY Release Publisher' -c user.email='45298254+ryanbytes@users.noreply.github.com' commit -m 'release: verified standalone-signed v1.1.67 Regular and Fire APK payloads [skip ci]'
          git push origin HEAD:refs/heads/release-payload/v1.1.67
      - name: Dispatch audited main-branch signed-payload publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-release.yml --repo ryanbytes/AGC-DSKY-Android --ref main -f version=1.1.67
