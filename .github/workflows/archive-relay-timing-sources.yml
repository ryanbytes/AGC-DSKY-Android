name: Relay SCD sheet archive bridge

on:
  push:
    branches:
      - archive/relay-timing-sources-20260927
    paths:
      - .github/workflows/archive-relay-timing-sources.yml

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch complete relay SCD sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          fetch_page () {
            local n="$1" out="$2"
            curl -L --fail --retry 4 --retry-all-errors -o "evidence/$out" "https://archive.org/download/AgcApertureCardsBatchStewart/page/n\${n}_w2000.jpg"
            file "evidence/$out" | grep -Eq 'JPEG|PNG'
          }
          fetch_page 258 1005001-C-sheet1-n258.jpg
          fetch_page 262 1005001-C-sheet2-n262.jpg
          fetch_page 266 1005001-C-sheet3-n266.jpg
          fetch_page 269 1005003-sheet1-n269.jpg
          fetch_page 267 1005003-sheet2-n267.jpg
          fetch_page 268 1005003-sheet3-n268.jpg
          cat > evidence/ACQUISITION.txt <<'EOF'
          Acquired 2026-09-27 from Internet Archive item AgcApertureCardsBatchStewart.
          1005001 revision C drawing index: sheet 1 n258; sheet 2 n262; sheet 3 n266.
          1005003 initial-release drawing index: sheet 1 n269; sheet 2 n267; sheet 3 n268.
          Index source: https://www.ibiblio.org/apollo/AgcDrawingIndex.html
          EOF
          file evidence/* > evidence/FILETYPES.txt
          sha256sum evidence/* | sort > evidence/SHA256SUMS.txt
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: relay-scd-complete-sheets-2026-09-27
          path: evidence/
          if-no-files-found: error
          compression-level: 6
