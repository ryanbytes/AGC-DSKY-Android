name: Verify launcher icon fix

on:
  push:
    branches:
      - test/v0.38.3-source-build

permissions:
  contents: read

jobs:
  verify-icon:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact staged source
        uses: actions/checkout@v5
        with:
          ref: sync/v0.38.3-refactor
          submodules: recursive
          fetch-depth: 0

      - name: Assert exact staged head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "e6a01b51a99de8eed1457e27fc4be839ea871c9b"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build and verify repository
        shell: bash
        run: bash tools/build-local.sh

      - name: Verify launcher icon in APK
        shell: bash
        run: bash tools/verify-launcher-icon.sh

      - name: Capture verified APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AGC-DSKY-icon-fix-e6a01b51.apk
          sha256sum AGC-DSKY-icon-fix-e6a01b51.apk > AGC-DSKY-icon-fix-e6a01b51.apk.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-icon-fix-e6a01b51
          path: |
            AGC-DSKY-icon-fix-e6a01b51.apk
            AGC-DSKY-icon-fix-e6a01b51.apk.sha256
          if-no-files-found: error
          retention-days: 7
