name: Sweep Apollo drawing indexes for relay sources
on:
  push:
    branches:
      - audit/relay-box459-20260928

jobs:
  sweep-indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Search all available NARA box indexes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sweep/indexes
          cd sweep
          : > fetched-boxes.txt
          : > matches.txt
          for n in $(seq 400 520); do
            url="https://www.ibiblio.org/apollo/AgcDrawingIndexBox${n}.html"
            if curl -fsL --retry 2 --retry-all-errors -A 'Mozilla/5.0' -o "indexes/box${n}.html" "$url"; then
              echo "$n" >> fetched-boxes.txt
              grep -niE '2004688|2004689|PS 2003952|>2003952<' "indexes/box${n}.html" | sed "s#^#BOX ${n}: #" >> matches.txt || true
            else
              rm -f "indexes/box${n}.html"
            fi
          done
          printf 'Fetched boxes: '; tr '\n' ' ' < fetched-boxes.txt; echo
          echo 'Matches:'
          cat matches.txt
          sha256sum indexes/*.html > INDEX-SHA256SUMS.txt
      - name: Upload sweep result
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-box-index-relay-sweep-2026-09-28
          path: sweep/
          if-no-files-found: error
          compression-level: 0
