name: Import CM panel photo reference

on:
  push:
    branches:
      - visual/cm-sheet3-surround-proof
    paths:
      - .github/workflows/cm-panel-photo-import.yml

permissions:
  contents: write

jobs:
  import-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/cm-sheet3-surround-proof

      - name: Fetch public-domain mounted DSKY photograph
        run: |
          mkdir -p app/src/main/assets/cm-panel
          curl --fail --location --retry 4 \
            'https://upload.wikimedia.org/wikipedia/commons/e/e2/Dsky.jpg' \
            --output app/src/main/assets/cm-panel/dsky-mounted-cm-panel.jpg
          file app/src/main/assets/cm-panel/dsky-mounted-cm-panel.jpg

      - name: Record source and license
        run: |
          cat > app/src/main/assets/cm-panel/README.txt <<'EOF'
          DSKY mounted in Apollo Command Module control panel.
          Source: https://commons.wikimedia.org/wiki/File:Dsky.jpg
          Original: https://upload.wikimedia.org/wikipedia/commons/e/e2/Dsky.jpg
          Author: Brandrodungswanderfeldhackbau
          Date: 2007-10-19
          License: Public domain (released by copyright holder).
          Imported only as the photographic surround reference for the CM DSKY presentation.
          EOF

      - name: Upload source photo for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: cm-mounted-dsky-photo
          path: app/src/main/assets/cm-panel/dsky-mounted-cm-panel.jpg
          if-no-files-found: error

      - name: Commit imported reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/cm-panel/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import real CM-mounted DSKY panel photo [skip ci]"
          git push origin HEAD:visual/cm-sheet3-surround-proof
