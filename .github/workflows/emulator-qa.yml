name: Emulator QA

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/emulator-20260927
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build regular debug APK
        run: |
          set -euxo pipefail
          bash tools/gradle-bootstrap.sh --no-daemon --stacktrace :app:verifyPinnedAgcAssets :app:assembleRegularDebug
          test -f app/build/outputs/apk/regular/debug/app-regular-debug.apk
          sha256sum app/build/outputs/apk/regular/debug/app-regular-debug.apk

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Run DSKY emulator QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash tools/emulator-qa.sh

      - name: Upload emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-qa-evidence
          path: qa/
          if-no-files-found: warn
          retention-days: 7
