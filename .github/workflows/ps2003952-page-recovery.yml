name: PS2003952 source recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PS 2016009 Rev A page 4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          url="https://iiif.archive.org/image/iiif/2/apertureCardBox466Part1NARASW_images%2FapertureCardBox466Part1NARASW_jp2.zip%2FapertureCardBox466Part1NARASW_jp2%2FapertureCardBox466Part1NARASW_0186.jp2/full/1200,/0/default.jpg"
          curl --fail --location --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 90 "$url" -o out/0186-page4.jpg
          file out/0186-page4.jpg
          sha256sum out/* > out/SHA256SUMS.txt
      - name: Upload page 4
        uses: actions/upload-artifact@v4
        with:
          name: ps2016009-reva-page4
          path: out/
          if-no-files-found: error
          retention-days: 7
