name: PS2003952 source recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact PS 2016009 Rev A pages 4-6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          id="apertureCardBox466Part1NARASW_images"
          stem="apertureCardBox466Part1NARASW"
          iiif="https://iiif.archive.org/image/iiif/2/${id}%2F${stem}_jp2.zip%2F${stem}_jp2%2F${stem}"
          for n in 0186 0187 0188; do
            url="${iiif}_${n}.jp2/full/3000,/0/default.jpg"
            echo "Fetching $url"
            curl --fail --location --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 180 \
              "$url" -o "out/${n}.jpg"
            file "out/${n}.jpg"
          done
          sha256sum out/* > out/SHA256SUMS.txt
          ls -lh out
      - name: Upload exact pages
        uses: actions/upload-artifact@v4
        with:
          name: ps2016009-reva-pages-4-6
          path: out/
          if-no-files-found: error
          retention-days: 7
