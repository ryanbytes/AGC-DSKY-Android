name: PS2003952 source recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact Box 459 JP2 leaves
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          base="https://iiif.archive.org/image/iiif/2/apertureCardBox459NARASW_images%2FapertureCardBox459NARASW_jp2.zip%2FapertureCardBox459NARASW_jp2%2FapertureCardBox459NARASW"
          for n in 0475 0476 0477; do
            url="${base}_${n}.jp2/full/3000,/0/default.jpg"
            echo "Fetching $url"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
              "$url" -o "out/${n}.jpg"
            file "out/${n}.jpg"
          done
          sha256sum out/* > out/SHA256SUMS.txt
          ls -lh out
      - name: Upload exact leaves
        uses: actions/upload-artifact@v4
        with:
          name: ps2003952-exact-leaves-0475-0477
          path: out/
          if-no-files-found: error
          retention-days: 7
