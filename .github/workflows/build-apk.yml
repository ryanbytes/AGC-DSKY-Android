name: Build installable APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 0'

permissions:
  contents: read

concurrency:
  group: agcdsky-main-apks
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v5
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable development signer
        id: signer-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: agcdsky-stable-debug-signer-v1

      - name: Bootstrap stable development signer
        if: steps.signer-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [[ -f ci/stable-signer.sha256 ]]; then
            echo 'Stable signer cache is missing; refusing to create a replacement signing identity.' >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname 'CN=AGC DSKY Development,O=Apollo DSKY Project,C=US'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build and verify normal APK
        shell: bash
        run: bash tools/build-local.sh

      - name: Capture normal APK and signer
        shell: bash
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=8 HEAD)"
          cp app/build/outputs/apk/debug/app-debug.apk "AGC-DSKY-main-${short}.apk"
          apksigner="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$apksigner" verify --print-certs "AGC-DSKY-main-${short}.apk" > SIGNER.txt
          digest="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' SIGNER.txt | head -n1 | tr '[:lower:]' '[:upper:]')"
          [[ -n "$digest" ]]
          printf '%s\n' "$digest" > SIGNER_SHA256.txt
          if [[ -f ci/stable-signer.sha256 ]]; then
            expected="$(tr '[:lower:]' '[:upper:]' < ci/stable-signer.sha256 | tr -d '[:space:]')"
            [[ "$digest" == "$expected" ]] || {
              echo "Signer changed: $digest != $expected" >&2
              exit 1
            }
          fi
          sha256sum "AGC-DSKY-main-${short}.apk" > "AGC-DSKY-main-${short}.apk.sha256"
          git rev-parse HEAD > SOURCE_COMMIT.txt

      - name: Build side-by-side prototype APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          old = "applicationId 'org.apollo.agcdsky'"
          new = "applicationId 'org.apollo.agcdsky.prototype'"
          if s.count(old) != 1:
              raise SystemExit('applicationId patch point mismatch')
          p.write_text(s.replace(old, new, 1))

          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          replacements = {
              'android:name=".SensorMainActivity"': 'android:name="org.apollo.agcdsky.SensorMainActivity"',
              'android:targetActivity=".SensorMainActivity"': 'android:targetActivity="org.apollo.agcdsky.SensorMainActivity"',
              'android:name=".ElWidgetProvider"': 'android:name="org.apollo.agcdsky.ElWidgetProvider"',
              'android:name=".AgcDreamService"': 'android:name="org.apollo.agcdsky.AgcDreamService"',
              'android:label="AGC DSKY v0.38.3"': 'android:label="AGC DSKY Prototype"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'manifest patch point missing: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          gradle --no-daemon :app:clean :app:assembleDebug
          short="$(git rev-parse --short=8 HEAD)"
          cp app/build/outputs/apk/debug/app-debug.apk "AGC-DSKY-side-by-side-${short}.apk"
          aapt2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          apksigner="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$aapt2" dump badging "AGC-DSKY-side-by-side-${short}.apk" | grep -Fq "package: name='org.apollo.agcdsky.prototype'"
          "$apksigner" verify --verbose "AGC-DSKY-side-by-side-${short}.apk" >/dev/null
          proto_digest="$("$apksigner" verify --print-certs "AGC-DSKY-side-by-side-${short}.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:lower:]' '[:upper:]')"
          normal_digest="$(tr -d '[:space:]' < SIGNER_SHA256.txt)"
          [[ "$proto_digest" == "$normal_digest" ]]
          sha256sum "AGC-DSKY-side-by-side-${short}.apk" > "AGC-DSKY-side-by-side-${short}.apk.sha256"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-main-${{ github.sha }}
          path: |
            AGC-DSKY-main-*.apk
            AGC-DSKY-main-*.apk.sha256
            AGC-DSKY-side-by-side-*.apk
            AGC-DSKY-side-by-side-*.apk.sha256
            SOURCE_COMMIT.txt
            SIGNER.txt
            SIGNER_SHA256.txt
          if-no-files-found: error
          retention-days: 30
