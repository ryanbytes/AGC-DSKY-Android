name: Android unsigned release build

on:
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'vendor/**'
      - 'VERSION'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-release-build.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'vendor/**'
      - 'VERSION'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-release-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$MANAGER"
          "$MANAGER" --sdk_root="$SDK" --install 'build-tools;36.0.0'
          # API 37 platform was provided as an official archive; sdkmanager's
          # installed index on the hosted runner does not yet list this package.
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/platform37.zip" 'https://dl.google.com/android/repository/platform-37.0_r01.zip'
          printf '%s  %s\n' '19bdcf42de0cb0e9500a27da6833fc30cdd49a7ec690aa5cabaa0ef893af9ebe' "$RUNNER_TEMP/platform37.zip" | sha256sum -c -
          mkdir -p "$SDK/platforms"
          rm -rf "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
          unzip -oq "$RUNNER_TEMP/platform37.zip" -d "$SDK/platforms"
          mv "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
      - name: Run canonical source tests
        run: bash tools/run-source-smokes.sh
      - name: Build unsigned Regular and Fire releases
        run: gradle --no-daemon :app:verifyPinnedAgcAssets :app:assembleRegularRelease :app:assembleFireRelease
      - name: Verify unsigned build metadata
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          for variant in regular fire; do
            apk="app/build/outputs/apk/${variant}/release/app-${variant}-release-unsigned.apk"
            test -s "$apk"
            "$BT/aapt2" dump badging "$apk" | grep "package: name='org.apollo.agcdsky' versionCode='2026101402' versionName='1.1.67'"
            sha256sum "$apk"
          done
          printf '%s\n' "${GITHUB_SHA}" > app/build/outputs/apk/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-1.1.67-unsigned
          path: |
            app/build/outputs/apk/regular/release/app-regular-release-unsigned.apk
            app/build/outputs/apk/fire/release/app-fire-release-unsigned.apk
            app/build/outputs/apk/source-commit.txt
          if-no-files-found: error
