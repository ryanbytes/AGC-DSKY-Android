name: Apple build

on:
  push:
    branches: [main, apple-port]
    paths:
      - 'apple/**'
      - 'app/src/main/assets/**'
      - 'vendor/webAGC'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'apple/**'
      - 'app/src/main/assets/**'
      - 'vendor/webAGC'
      - '.github/workflows/apple.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned AGC assets
        run: apple/tools/verify-pinned-assets.sh

      - name: Build macOS app
        run: |
          xcodebuild \
            -project apple/AGCDSKY.xcodeproj \
            -target AGCDSKYmacOS \
            -configuration Debug \
            -sdk macosx \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project apple/AGCDSKY.xcodeproj \
            -target AGCDSKYiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
