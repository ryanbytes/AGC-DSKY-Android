name: Publish signed release payload

on:
  push:
    branches:
      - 'release-payload/**'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct standalone-signed APKs from tested unsigned artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(tr -d '\r\n' < VERSION)"
          test "$VERSION_NAME" = "1.1.61"
          PAYLOAD_DIR="release-payload/v${VERSION_NAME}"
          UNSIGNED="$RUNNER_TEMP/unsigned"
          mkdir -p "$UNSIGNED"
          gh run download 36795785683 -n AGC-DSKY-Android-unsigned-release -D "$UNSIGNED"

          cat "$PAYLOAD_DIR"/chunks/regular.*.b64 | base64 -d | gzip -dc > "$RUNNER_TEMP/regular.tail"
          cat "$PAYLOAD_DIR"/chunks/fire.*.b64 | base64 -d | gzip -dc > "$RUNNER_TEMP/fire.tail"

          head -c 982229 "$UNSIGNED/regular/release/app-regular-release-unsigned.apk" > "$PAYLOAD_DIR/app-regular-release.apk"
          cat "$RUNNER_TEMP/regular.tail" >> "$PAYLOAD_DIR/app-regular-release.apk"
          head -c 984819 "$UNSIGNED/fire/release/app-fire-release-unsigned.apk" > "$PAYLOAD_DIR/app-fire-release.apk"
          cat "$RUNNER_TEMP/fire.tail" >> "$PAYLOAD_DIR/app-fire-release.apk"

      - name: Verify exact standalone-signed payload
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(tr -d '\r\n' < VERSION)"
          PAYLOAD_DIR="release-payload/v${VERSION_NAME}"
          (
            cd "$PAYLOAD_DIR"
            sha256sum -c app-regular-release.apk.sha256
            sha256sum -c app-fire-release.apk.sha256
          )

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION_NAME}"
          PAYLOAD_DIR="release-payload/${TAG}"
          NOTES="${PAYLOAD_DIR}/RELEASE_NOTES.txt"
          ASSETS=(
            "${PAYLOAD_DIR}/app-regular-release.apk"
            "${PAYLOAD_DIR}/app-regular-release.apk.sha256"
            "${PAYLOAD_DIR}/app-fire-release.apk"
            "${PAYLOAD_DIR}/app-fire-release.apk.sha256"
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
            gh release edit "${TAG}" --title "AGC DSKY ${TAG}" --target main --latest
          else
            gh release create "${TAG}" "${ASSETS[@]}" --target main --title "AGC DSKY ${TAG}" --notes-file "${NOTES}" --latest
          fi
