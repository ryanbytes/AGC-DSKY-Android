name: Publish signed release payload

on:
  push:
    branches:
      - 'release-payload/**'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android Build Tools 36
        run: sdkmanager 'build-tools;36.0.0' 'platform-tools'

      - name: Download verified v1.1.54 unsigned APKs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 36719972495 \
            --repo "$GITHUB_REPOSITORY" \
            --name AGC-DSKY-Android-unsigned-release \
            --dir "$RUNNER_TEMP/unsigned"

      - name: Reconstruct exact standalone-signed APKs
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(tr -d '\r\n' < VERSION)"
          test "$VERSION_NAME" = "1.1.54"
          PAYLOAD_DIR="release-payload/v${VERSION_NAME}"
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          REG_U="$(find "$RUNNER_TEMP/unsigned" -type f -name app-regular-release-unsigned.apk -print -quit)"
          FIRE_U="$(find "$RUNNER_TEMP/unsigned" -type f -name app-fire-release-unsigned.apk -print -quit)"
          test -f "$REG_U"
          test -f "$FIRE_U"
          "$BT/zipalign" -p -f 4 "$REG_U" "$PAYLOAD_DIR/app-regular-release.apk"
          "$BT/zipalign" -p -f 4 "$FIRE_U" "$PAYLOAD_DIR/app-fire-release.apk"
          echo '308e22dd3c5c59156ac599bb1cd2ac20f1b059dc73ad7af4a176b810bdc3f102  release-payload/v1.1.54/app-regular-release.apk' | sha256sum -c -
          echo '51cbf366033494c13cfbf94b8c24cc160a3c12cfc7df637b569edb9f7748cbba  release-payload/v1.1.54/app-fire-release.apk' | sha256sum -c -
          cat "$PAYLOAD_DIR"/patches/regpart-* | base64 -d > "$RUNNER_TEMP/regular-signing.patch"
          cat "$PAYLOAD_DIR"/patches/firepart-* | base64 -d > "$RUNNER_TEMP/fire-signing.patch"
          echo 'a2a92d56b36fb490e51dc9a605aa2c97f2793b16cc4ef034c16c9e36659767b2  '"$RUNNER_TEMP"'/regular-signing.patch' | sha256sum -c -
          echo 'ea63afb0550ff416de75999bbc7807e73aa0e4895ebcd22a2a429f2817fdb36b  '"$RUNNER_TEMP"'/fire-signing.patch' | sha256sum -c -
          git apply --binary --directory="$PAYLOAD_DIR" "$RUNNER_TEMP/regular-signing.patch"
          git apply --binary --directory="$PAYLOAD_DIR" "$RUNNER_TEMP/fire-signing.patch"
          sha256sum "$PAYLOAD_DIR/app-regular-release.apk" "$PAYLOAD_DIR/app-fire-release.apk"

      - name: Verify signed release payload
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(tr -d '\r\n' < VERSION)"
          PAYLOAD_DIR="release-payload/v${VERSION_NAME}"
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          (
            cd "$PAYLOAD_DIR"
            sha256sum -c app-regular-release.apk.sha256
            sha256sum -c app-fire-release.apk.sha256
          )
          EXPECTED_CERT='409ad676e8052e50416a1bf69e095137ef639ac13ce4652160a19380a117fa1f'
          grep -F '332bf1dc7eb47873ad4a6b460dfa40ea883d82cf31600b4d8c705965176ffc4f' "$PAYLOAD_DIR/app-regular-release.apk.sha256"
          grep -F '17ec276b0f1b8db6d7a242091c93541fa2ec627977b54e101b41b94f08db6cde' "$PAYLOAD_DIR/app-fire-release.apk.sha256"
          for APK in "$PAYLOAD_DIR/app-regular-release.apk" "$PAYLOAD_DIR/app-fire-release.apk"; do
            "$BT/zipalign" -c -v 4 "$APK"
            VERIFY="$($BT/apksigner verify --verbose --print-certs "$APK")"
            echo "$VERIFY" | grep -F 'Verified using v1 scheme (JAR signing): false'
            echo "$VERIFY" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
            echo "$VERIFY" | grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true'
            CERT="$(echo "$VERIFY" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':\r' | tr 'A-F' 'a-f')"
            test "$CERT" = "$EXPECTED_CERT"
            BADGE="$($BT/aapt dump badging "$APK")"
            echo "$BADGE" | grep -F "package: name='org.apollo.agcdsky' versionCode='2026093001' versionName='1.1.54'"
            echo "$BADGE" | grep -F "application-label:'AGC DSKY v1.1.54'"
          done
          REG_U="$(find "$RUNNER_TEMP/unsigned" -type f -name app-regular-release-unsigned.apk -print -quit)"
          FIRE_U="$(find "$RUNNER_TEMP/unsigned" -type f -name app-fire-release-unsigned.apk -print -quit)"
          python3 - "$REG_U" "$PAYLOAD_DIR/app-regular-release.apk" "$FIRE_U" "$PAYLOAD_DIR/app-fire-release.apk" <<'PY'
          import sys, zipfile
          pairs=[("regular",sys.argv[1],sys.argv[2]),("fire",sys.argv[3],sys.argv[4])]
          for label,unsigned,signed in pairs:
              with zipfile.ZipFile(unsigned) as u, zipfile.ZipFile(signed) as s:
                  unames=sorted(n for n in u.namelist() if not n.startswith("META-INF/"))
                  snames=sorted(n for n in s.namelist() if not n.startswith("META-INF/"))
                  if unames != snames:
                      raise SystemExit(f"{label}: payload member list changed")
                  for name in unames:
                      if u.read(name) != s.read(name):
                          raise SystemExit(f"{label}: payload bytes changed: {name}")
                  print(f"{label}: {len(unames)} non-META-INF entries byte-identical")
          PY

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION_NAME}"
          TARGET_SHA='1e05fe3efaa85e47e8dfa1410413885e1665a472'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$TARGET_SHA"
          PAYLOAD_DIR="release-payload/${TAG}"
          NOTES="${PAYLOAD_DIR}/RELEASE_NOTES.txt"
          ASSETS=(
            "${PAYLOAD_DIR}/app-regular-release.apk"
            "${PAYLOAD_DIR}/app-regular-release.apk.sha256"
            "${PAYLOAD_DIR}/app-fire-release.apk"
            "${PAYLOAD_DIR}/app-fire-release.apk.sha256"
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
            gh release edit "${TAG}" --title "AGC DSKY ${TAG}" --target "${TARGET_SHA}" --latest
          else
            gh release create "${TAG}" "${ASSETS[@]}" --target "${TARGET_SHA}" --title "AGC DSKY ${TAG}" --notes-file "${NOTES}" --latest
          fi

      - name: Verify published release readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.1.54'
          EXPECTED_SOURCE='1e05fe3efaa85e47e8dfa1410413885e1665a472'
          PUB="$RUNNER_TEMP/published-release"
          rm -rf "$PUB"
          mkdir -p "$PUB"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$PUB" --clobber
          cmp release-payload/v1.1.54/app-regular-release.apk "$PUB/app-regular-release.apk"
          cmp release-payload/v1.1.54/app-fire-release.apk "$PUB/app-fire-release.apk"
          cmp release-payload/v1.1.54/app-regular-release.apk.sha256 "$PUB/app-regular-release.apk.sha256"
          cmp release-payload/v1.1.54/app-fire-release.apk.sha256 "$PUB/app-fire-release.apk.sha256"
          (
            cd "$PUB"
            sha256sum -c app-regular-release.apk.sha256
            sha256sum -c app-fire-release.apk.sha256
          )
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = "$TAG"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)" = "$EXPECTED_SOURCE"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[].name' | LC_ALL=C sort > /tmp/published-assets.txt
          printf '%s\n' app-fire-release.apk app-fire-release.apk.sha256 app-regular-release.apk app-regular-release.apk.sha256 | LC_ALL=C sort > /tmp/expected-assets.txt
          diff -u /tmp/expected-assets.txt /tmp/published-assets.txt
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[] | select(.name=="app-regular-release.apk") | .digest')" = 'sha256:332bf1dc7eb47873ad4a6b460dfa40ea883d82cf31600b4d8c705965176ffc4f'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[] | select(.name=="app-fire-release.apk") | .digest')" = 'sha256:17ec276b0f1b8db6d7a242091c93541fa2ec627977b54e101b41b94f08db6cde'
