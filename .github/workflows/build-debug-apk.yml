name: Build self-contained debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned sources and webAGC submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'

      - name: Verify pinned AGC runtime assets
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C vendor/webAGC rev-parse HEAD)" = "0575ea7a1231e3948bae7d2c22a6ac146da0c38d"
          test "$(git -C vendor/webAGC hash-object src/yaAGC.wasm)" = "713685680492098d05437b99c26403f683d56009"
          test "$(git -C vendor/webAGC hash-object demo/agc/Luminary099.bin)" = "cd2ec9992d5863e1c7234fa760020f68ef946202"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK is offline and contains AGC runtime
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          grep -q 'assets/yaAGC.wasm' apk-contents.txt
          grep -q 'assets/Luminary099.bin' apk-contents.txt
          rm -rf apkcheck && mkdir apkcheck
          unzip -q "$APK" assets/yaAGC.wasm assets/Luminary099.bin -d apkcheck
          test "$(git hash-object apkcheck/assets/yaAGC.wasm)" = "713685680492098d05437b99c26403f683d56009"
          test "$(git hash-object apkcheck/assets/Luminary099.bin)" = "cd2ec9992d5863e1c7234fa760020f68ef946202"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$APK" | tee apk-permissions.txt
          if grep -Fq 'android.permission.INTERNET' apk-permissions.txt; then
            echo 'ERROR: APK requests INTERNET permission' >&2
            exit 1
          fi
          grep -Fq 'android.permission.ACCESS_COARSE_LOCATION' apk-permissions.txt
          grep -Fq 'android.permission.ACCESS_FINE_LOCATION' apk-permissions.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AGC-DSKY-self-contained-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
