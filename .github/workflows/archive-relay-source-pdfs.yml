name: Recover DSKY archival drawings
on:
  push:
    branches:
      - archive/relay-source-pdfs-20260927
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect Internet Archive item and recover target pages
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p recovered
          cd recovered
          curl -fL --retry 4 --retry-all-errors -o metadata.json 'https://archive.org/metadata/apertureCardBox460NARASW_images'
          python3 - <<'PY'
          import json
          m=json.load(open('metadata.json'))
          print('identifier=',m.get('metadata',{}).get('identifier'))
          for f in m.get('files',[]):
              n=f.get('name','')
              if any(x in n.lower() for x in ('pdf','jp2','zip','scandata','djvu','text','xml')):
                  print(n, f.get('size',''))
          PY
          # Preserve metadata even if page recovery needs a second pass.
      - name: Upload inspection result
        uses: actions/upload-artifact@v4
        with:
          name: apertureCardBox460-metadata
          path: recovered/metadata.json
          if-no-files-found: error
