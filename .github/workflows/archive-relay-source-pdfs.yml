name: Recover DSKY relay driver drawings
on:
  push:
    branches:
      - archive/relay-source-pdfs-20260927
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch relay-driver and continuation leaves
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p recovered
          cd recovered
          base='https://ia601408.us.archive.org/BookReader/BookReaderImages.php'
          zip='/9/items/apertureCardBox460NARASW_images/apertureCardBox460NARASW_jp2.zip'
          for n in 0376 0377 0378 0379 0422 0426 0427 0428 0429; do
            file="apertureCardBox460NARASW_jp2/apertureCardBox460NARASW_${n}.jp2"
            curl -fL --retry 3 --retry-all-errors --get "$base" \
              --data-urlencode "zip=$zip" \
              --data-urlencode "file=$file" \
              --data-urlencode 'id=apertureCardBox460NARASW_images' \
              --data-urlencode 'scale=2' \
              --data-urlencode 'rotate=0' \
              -o "leaf-${n}.jpg"
            file "leaf-${n}.jpg"
          done
          sha256sum leaf-*.jpg > SHA256SUMS.txt
      - name: Upload recovered scans
        uses: actions/upload-artifact@v4
        with:
          name: DSKY-relay-driver-original-scans
          path: recovered/
          if-no-files-found: error
          compression-level: 0
