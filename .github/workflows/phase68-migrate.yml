name: Phase 68 migrate late-service reads

on:
  push:
    branches:
      - refactor/dsky-runtime-phase68

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dsky-runtime-phase68
      - name: Migrate audited compatibility reads
        run: python3 tools/phase68-migrate-late-reads.py
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No migration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets
          git commit -m "Migrate late-service consumers to registry"
          git push origin HEAD:refactor/dsky-runtime-phase68
