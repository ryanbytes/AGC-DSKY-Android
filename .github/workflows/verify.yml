name: Verify repository

on:
  push:
    branches:
      - main
      - sync/v0.38.3-refactor
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and pinned webAGC
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Run repository build and verification harness
        shell: bash
        run: bash tools/build-local.sh

      - name: Verify packaged launcher icon
        shell: bash
        run: bash tools/verify-launcher-icon.sh
