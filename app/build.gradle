plugins {
    id 'com.android.application'
}

def generatedAgcAssetsDir = layout.buildDirectory.dir('generated/agcAssets').get().asFile
def generatedElWidgetResDir = layout.buildDirectory.dir('generated/elWidgetRes').get().asFile
def elWidgetFontSource = file('../tools/dsky-el-font.b64')

android {
    namespace 'org.apollo.agcdsky'
    compileSdk 37
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'org.apollo.agcdsky'
        minSdk 26
        targetSdk 37
        versionCode 19
        versionName '0.19'
    }

    // Keep generated binary inputs explicit. The AGC core/ropes are verified
    // and staged as assets; the small custom EL font is decoded from a tracked
    // base64 text file into generated resources so the repository remains
    // editable through text-only tooling while the APK receives exact TTF bytes.
    sourceSets {
        main {
            assets.srcDirs = [
                'src/main/assets',
                generatedAgcAssetsDir
            ]
            res.srcDirs = [
                'src/main/res',
                generatedElWidgetResDir
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Refuse to build if the recursive submodule checkout is missing or if any of
// the three binary inputs differs from the exact pinned Git blob. This catches
// truncated/manual rope reconstruction and accidental submodule drift before
// Android packaging can produce a misleading APK.
def pinnedAgcAssets = [
        [
                label: 'yaAGC.wasm',
                file: file('../vendor/webAGC/src/yaAGC.wasm'),
                size: 132617L,
                gitBlobSha1: '713685680492098d05437b99c26403f683d56009'
        ],
        [
                label: 'Luminary099.bin',
                file: file('../vendor/webAGC/demo/agc/Luminary099.bin'),
                size: 73728L,
                gitBlobSha1: 'cd2ec9992d5863e1c7234fa760020f68ef946202'
        ],
        [
                label: 'Comanche055.bin',
                file: file('../vendor/webAGC/demo/agc/Comanche055.bin'),
                size: 73728L,
                gitBlobSha1: '9e4ec167dc99ac12b233df07b6b91fef585e5015'
        ]
]

def verifyPinnedAgcAssets = tasks.register('verifyPinnedAgcAssets') {
    group = 'verification'
    description = 'Verify the exact pinned yaAGC WASM and Apollo rope assets.'

    inputs.files(pinnedAgcAssets.collect { it.file })

    doLast {
        pinnedAgcAssets.each { spec ->
            File asset = spec.file
            if (!asset.isFile()) {
                throw new GradleException(
                        "Missing ${spec.label}: ${asset}. "
                                + 'Run git submodule update --init --recursive before building.')
            }

            byte[] bytes = asset.bytes
            if (bytes.length != spec.size) {
                throw new GradleException(
                        "${spec.label} has ${bytes.length} bytes; expected ${spec.size}.")
            }

            def digest = java.security.MessageDigest.getInstance('SHA-1')
            digest.update("blob ${bytes.length}\u0000"
                    .getBytes(java.nio.charset.StandardCharsets.UTF_8))
            digest.update(bytes)
            String actual = digest.digest().collect {
                String.format('%02x', it & 0xff)
            }.join()

            if (!actual.equalsIgnoreCase(spec.gitBlobSha1)) {
                throw new GradleException(
                        "${spec.label} Git blob SHA-1 ${actual}; expected ${spec.gitBlobSha1}.")
            }
        }
    }
}

def stagePinnedAgcAssets = tasks.register('stagePinnedAgcAssets', Sync) {
    group = 'build setup'
    description = 'Stage only the verified yaAGC WASM and two selected Apollo ropes.'
    dependsOn verifyPinnedAgcAssets
    from pinnedAgcAssets.collect { it.file }
    into generatedAgcAssetsDir
}

def stageElWidgetFont = tasks.register('stageElWidgetFont') {
    group = 'build setup'
    description = 'Decode the tracked Apollo-style EL widget font into generated Android resources.'
    inputs.file(elWidgetFontSource)
    File outputFont = new File(generatedElWidgetResDir, 'font/dsky_el.ttf')
    outputs.file(outputFont)

    doLast {
        if (!elWidgetFontSource.isFile()) {
            throw new GradleException("Missing EL widget font source: ${elWidgetFontSource}")
        }
        outputFont.parentFile.mkdirs()
        String encoded = elWidgetFontSource.getText('UTF-8').replaceAll('\\s+', '')
        outputFont.bytes = java.util.Base64.getDecoder().decode(encoded)
        if (outputFont.length() < 1024L) {
            throw new GradleException("Decoded EL widget font is unexpectedly small: ${outputFont.length()} bytes")
        }
    }
}

// Make staging part of the ordinary Android pre-build path. The merge-task
// dependency is retained as a direct guard for callers that invoke merge tasks
// without going through assemble/preBuild.
tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn stagePinnedAgcAssets
    dependsOn stageElWidgetFont
}
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn stagePinnedAgcAssets
}
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Resources') }.configureEach {
    dependsOn stageElWidgetFont
}
