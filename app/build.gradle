plugins {
    id 'com.android.application'
}

def generatedAgcAssetsDir = layout.buildDirectory.dir('generated/agcAssets').get().asFile
def generatedElSecondsResDir = layout.buildDirectory.dir('generated/elSecondsRes').get().asFile

android {
    namespace = 'org.apollo.agcdsky'
    compileSdk 37
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'org.apollo.agcdsky'
        minSdk 26
        targetSdk 37
        versionCode 20061
        versionName '1.1.4'
    }

    flavorDimensions += 'target'
    productFlavors {
        regular {
            dimension 'target'
        }
        fire {
            dimension 'target'
        }
    }

    // Debug builds are intentionally installable alongside a release build so
    // hardware/UI work can be device-tested without replacing the user's HOME app.
    buildTypes {
        debug {
            applicationIdSuffix '.eltest'
            versionNameSuffix '-eltest'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', generatedAgcAssetsDir]
            res.srcDirs = ['src/main/res', generatedElSecondsResDir]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The refactored CM app packages only the WASM core and Comanche 055 rope.
def pinnedAgcAssets = [
        [label:'yaAGC.wasm', file:file('../vendor/webAGC/src/yaAGC.wasm'), size:132617L, gitBlobSha1:'713685680492098d05437b99c26403f683d56009'],
        [label:'Comanche055.bin', file:file('../vendor/webAGC/demo/agc/Comanche055.bin'), size:73728L, gitBlobSha1:'9e4ec167dc99ac12b233df07b6b91fef585e5015']
]

def verifyPinnedAgcAssets = tasks.register('verifyPinnedAgcAssets') {
    group = 'verification'
    description = 'Verify the exact pinned yaAGC WASM and Apollo CM rope assets.'
    inputs.files(pinnedAgcAssets.collect { it.file })
    doLast {
        pinnedAgcAssets.each { spec ->
            File asset = spec.file
            if (!asset.isFile()) throw new GradleException("Missing ${spec.label}: ${asset}. Run git submodule update --init --recursive before building.")
            byte[] bytes = asset.bytes
            if (bytes.length != spec.size) throw new GradleException("${spec.label} has ${bytes.length} bytes; expected ${spec.size}.")
            def digest = java.security.MessageDigest.getInstance('SHA-1')
            digest.update("blob ${bytes.length}\u0000".getBytes(java.nio.charset.StandardCharsets.UTF_8)); digest.update(bytes)
            String actual = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
            if (!actual.equalsIgnoreCase(spec.gitBlobSha1)) throw new GradleException("${spec.label} Git blob SHA-1 ${actual}; expected ${spec.gitBlobSha1}.")
        }
    }
}

def stagePinnedAgcAssets = tasks.register('stagePinnedAgcAssets', Sync) {
    group = 'build setup'
    description = 'Stage only the verified yaAGC WASM and selected Apollo CM rope.'
    dependsOn verifyPinnedAgcAssets
    from pinnedAgcAssets.collect { it.file }
    into generatedAgcAssetsDir
}

def generateElSecondFrames = tasks.register('generateElSecondFrames', Exec) {
    group = 'build setup'
    description = 'Generate 00-59 Apollo-vector register frames for the live seconds flipper.'
    inputs.file(file('../tools/generate-el-second-frames.js'))
    outputs.dir(generatedElSecondsResDir)
    commandLine 'node', file('../tools/generate-el-second-frames.js'), generatedElSecondsResDir
}

tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn stagePinnedAgcAssets; dependsOn generateElSecondFrames }
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach { dependsOn stagePinnedAgcAssets }
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Resources') }.configureEach { dependsOn generateElSecondFrames }
