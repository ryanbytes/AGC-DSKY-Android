plugins {
    id 'com.android.application'
}

android {
    namespace 'org.apollo.agcdsky'
    compileSdk 37

    defaultConfig {
        applicationId 'org.apollo.agcdsky'
        minSdk 26
        targetSdk 37
        versionCode 6
        versionName '0.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
