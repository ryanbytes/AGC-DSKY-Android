plugins {
    id 'com.android.application'
}

android {
    namespace 'org.apollo.agcdsky'
    compileSdk 37

    defaultConfig {
        applicationId 'org.apollo.agcdsky'
        minSdk 26
        targetSdk 37
        versionCode 7
        versionName '0.7'
    }

    // The pinned webAGC submodule supplies yaAGC.wasm plus the Apollo 11
    // Luminary099/Comanche055 rope images. Clone with --recurse-submodules.
    sourceSets {
        main {
            assets.srcDirs = [
                'src/main/assets',
                '../vendor/webAGC/src',
                '../vendor/webAGC/demo/agc'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
