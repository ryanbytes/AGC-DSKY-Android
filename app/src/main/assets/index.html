<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AGC DSKY</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="controls-layout.css">
<link rel="stylesheet" href="agc-state.css">
<link rel="stylesheet" href="main-panel-surround.css">
<link rel="stylesheet" href="cm-dsky-finish.css">
<link rel="stylesheet" href="screen-only.css">
<link rel="stylesheet" href="optics.css">
<link rel="stylesheet" href="cheatsheet.css">
<link rel="stylesheet" href="diagnostics.css">
<link rel="stylesheet" href="legal.css">

<style id="dsky-solo">
html,body,#app{background:#000!important}
.hint{display:none!important}
#mode{display:none!important}
#app{padding:2px!important}
.dsky{z-index:3!important}
/* Block II EL glass: gray face with the source-art ITO/contact hardware visible. */
.el-glass-background{fill:#696d67}
.el-hardware-border{fill:none;stroke:#a2a69f;stroke-width:.48;opacity:.72}
.el-ito-dot{fill:#a2a69f;opacity:.88}
</style>
</head>
<body>
<main id="app">
  <section id="dsky" class="dsky" aria-label="Apollo Block II DSKY">
    <div class="ann-well" aria-hidden="true"></div>
    <div class="display-well" aria-hidden="true"></div>

    <div class="ann-grid">
      <div class="lamp white" data-lamp="uplink">UPLINK<br>ACTY</div><div class="lamp yellow" data-lamp="temp">TEMP</div>
      <div class="lamp white" data-lamp="noatt">NO ATT</div><div class="lamp yellow" data-lamp="gimbal">GIMBAL<br>LOCK</div>
      <div class="lamp white" data-lamp="stby">STBY</div><div class="lamp yellow" data-lamp="prog">PROG</div>
      <div class="lamp white" data-lamp="keyrel">KEY REL</div><div class="lamp yellow" data-lamp="restart">RESTART</div>
      <div class="lamp white" data-lamp="oprerr">OPR ERR</div><div class="lamp yellow" data-lamp="tracker">TRACKER</div>
      <div class="lamp white blank" aria-hidden="true"></div><div class="lamp yellow blank" aria-hidden="true"></div>
      <div class="lamp white blank" aria-hidden="true"></div><div class="lamp yellow blank" aria-hidden="true"></div>
    </div>

    <svg id="elpanel" class="elpanel" viewBox="0 0 106 190" preserveAspectRatio="none" aria-label="DSKY electroluminescent display">
      <defs>
        <filter id="elSoft" x="-35%" y="-35%" width="170%" height="170%">
          <feGaussianBlur stdDeviation="0.24" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="elGlow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.05" result="halo"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="0.30" result="near"/>
          <feMerge><feMergeNode in="halo"/><feMergeNode in="near"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!--
        Source-backed Block II glass hardware, mapped from Ben Krasnow's
        DSKY V2.svg glass outline / Display border / ITO connection-dot layers
        into this app's existing 106 x 190 EL coordinate system.
      -->
      <rect class="el-glass-background" x="0" y="0" width="106" height="190" aria-hidden="true"/>
      <rect class="el-hardware-border" x="2.119" y="2.350" width="101.763" height="185.299" aria-hidden="true"/>
      <g class="el-ito-dots" aria-hidden="true">
        <ellipse class="el-ito-dot" cx="53.000" cy="6.914" rx="1.294" ry="1.369"/>
        <ellipse class="el-ito-dot" cx="53.000" cy="43.427" rx="1.294" ry="1.369"/>
        <ellipse class="el-ito-dot" cx="53.000" cy="79.939" rx="1.294" ry="1.369"/>
        <ellipse class="el-ito-dot" cx="100.863" cy="89.061" rx="1.294" ry="1.369"/>
        <ellipse class="el-ito-dot" cx="100.863" cy="123.753" rx="1.294" ry="1.369"/>
        <ellipse class="el-ito-dot" cx="100.863" cy="158.598" rx="1.294" ry="1.369"/>
        <ellipse class="el-ito-dot" cx="8.286" cy="158.574" rx="1.294" ry="1.369"/>
        <ellipse class="el-ito-dot" cx="8.286" cy="123.548" rx="1.294" ry="1.369"/>
        <ellipse class="el-ito-dot" cx="8.286" cy="89.067" rx="1.294" ry="1.369"/>
      </g>
      <g class="el-static" aria-hidden="true">
        <text class="el-label" x="87" y="9" text-anchor="middle">PROG</text>
        <text class="el-label" x="20" y="54" text-anchor="middle">VERB</text>
        <text class="el-label" x="87" y="54" text-anchor="middle">NOUN</text>
        <line class="el-rule" x1="12" y1="89" x2="94" y2="89"/>
        <line class="el-rule" x1="12" y1="125" x2="94" y2="125"/>
        <line class="el-rule" x1="12" y1="159" x2="94" y2="159"/>
      </g>
      <g id="comp" class="comp-el" data-lamp="comp" aria-label="COMP ACTY">
        <text x="19" y="14" text-anchor="middle">COMP</text>
        <text x="19" y="22" text-anchor="middle">ACTY</text>
      </g>
      <g id="prog" class="el-field" transform="translate(73 13)"></g>
      <g id="verb" class="el-field" transform="translate(6 58)"></g>
      <g id="noun" class="el-field" transform="translate(73 58)"></g>
      <g id="r1" class="el-field" transform="translate(3 97)"></g>
      <g id="r2" class="el-field" transform="translate(3 131)"></g>
      <g id="r3" class="el-field" transform="translate(3 165)"></g>
    </svg>

    <button class="key k-r1c1 fn" data-key="V">VERB</button>
    <button class="key k-r1c2" data-key="+">+</button>
    <button class="key k-r1c3" data-key="7">7</button>
    <button class="key k-r1c4" data-key="8">8</button>
    <button class="key k-r1c5" data-key="9">9</button>
    <button class="key k-r1c6 fn" data-key="C">CLR</button>
    <button class="key k-r1c7 fn" data-key="E">ENTR</button>

    <button class="key k-r2c1 fn" data-key="N">NOUN</button>
    <button class="key k-r2c2" data-key="-">−</button>
    <button class="key k-r2c3" data-key="4">4</button>
    <button class="key k-r2c4" data-key="5">5</button>
    <button class="key k-r2c5" data-key="6">6</button>
    <button class="key k-r2c6 fn" data-key="P">PRO</button>
    <button class="key k-r2c7 fn" data-key="R">RSET</button>

    <button class="key k-r3c2" data-key="0">0</button>
    <button class="key k-r3c3" data-key="1">1</button>
    <button class="key k-r3c4" data-key="2">2</button>
    <button class="key k-r3c5" data-key="3">3</button>
    <button class="key k-r3c6 fn keyrel" data-key="K">KEY<br>REL</button>

    <i class="fastener f1"></i><i class="fastener f2"></i><i class="fastener f3"></i><i class="fastener f4"></i>
  </section>
  <div class="app-controls" id="controls">
    <button id="dim">PANEL DIMMER</button><button id="dreambright">DREAM BRIGHTNESS DIM</button><button id="sound">RELAY CLICKS ON</button><button id="display">FULL DSKY DISPLAY</button><button id="agc">AGC MODE</button><button id="clock">CLOCK MODE</button><button id="imu-zero">IMU SENSOR WAITING</button><button id="mag-lock">MAGNETOMETER WAITING</button><button id="pipa-cal">PIPA SENSOR WAITING</button><button id="sxt">SEXTANT</button><button id="cheat">CHEAT SHEET</button><button id="diagnostics">DIAGNOSTICS</button><button id="legal">LEGAL / SOURCE</button><span id="mode">PHONE CLOCK · LOCAL WALL TIME</span>
  </div>
  <div class="hint" id="hint">Hold panel for controls</div>
</main>
<script src="agc-core.js"></script>
<script src="spacecraft-default.js"></script>
<script src="startup-defaults.js"></script>
<script src="app.js"></script>
<script src="clock-behavior.js"></script>
<script src="phone-icdu.js"></script>
<script src="apollo-stars.js"></script>
<script src="optics.js"></script>
<script src="cm-mode.js"></script>
<script src="relay-audio-refine.js"></script>
<script src="dsky-geometry.js"></script>
<script src="hardware-fidelity.js"></script>
<script src="background-audio-guard.js"></script>
<script src="screen-only.js"></script>
<script src="cheatsheet.js"></script>
<script src="diagnostics.js"></script>
<script src="legal.js"></script>
<script src="dream-agc.js"></script>
</body>
</html>
